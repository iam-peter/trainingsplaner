# Publishes the website on GitHub Pages. The page looks up the latest
# release and nightly itself, so new builds need no new deployment.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "docs/screenshots/**"
      - "docs/HANDBUCH.md"
      - "docs/handbuch/**"
      - "logo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Site
        run: |
          mkdir site
          cp -r pages/. site/
          cp logo/trainingsplaner.svg logo/trainingsplaner.png site/
          cp docs/screenshots/*.png site/
          # The handbook, from docs/HANDBUCH.md, with its pictures
          mkdir -p site/handbuch
          cp -r docs/handbuch/bilder site/handbuch/
          python3 docs/handbuch/build_page.py docs/HANDBUCH.md site/handbuch.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
